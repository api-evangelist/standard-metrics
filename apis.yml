aid: standard-metrics
name: Standard Metrics
description: >-
  Standard Metrics is an AI-driven portfolio management platform for venture capital and private
  equity firms. It centralizes portfolio company performance data, financial metrics, documents,
  cap-table and investment data, and notes so investors can streamline portfolio reviews, audits,
  and LP reporting while reducing the reporting burden on portfolio companies. Standard Metrics
  exposes a REST API (OAuth2 client-credentials, Bearer tokens) covering companies, metrics, budgets,
  documents, funds, information requests, notes, users, and a beta Investment Data API for cap-table
  financing events, securities, share classes, and transactions. It also publishes two official
  remote MCP servers that connect Claude, ChatGPT, and other LLM clients directly to firm data.
